name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unit tests (no Qdrant / LLM)
        run: |
          pytest tests/test_query_rewrite.py \
            tests/test_brief_markets.py \
            tests/test_brief_cost.py \
            tests/test_cost.py \
            tests/test_conversation_history.py \
            tests/test_regulatory.py \
            tests/test_corpus_health.py \
            tests/test_formulation_review.py \
            tests/test_parsers.py \
            tests/test_kbs_name_quality.py \
            -q

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and typecheck
        run: |
          npm ci
          npm run build --if-present || npx tsc --noEmit
